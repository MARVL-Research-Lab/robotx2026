<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Team MARVL: the quadrotor above, the BlueBoat on the water, the ROV below.
       The wave, the bob, the status light and the ROV lamp animate where the
       browser supports SMIL in a favicon; site.js redraws frames elsewhere. -->
  <rect width="32" height="32" rx="6" fill="#04121a"/>
  <g id="quad">
    <path d="M14 3.5 L24 11.5 M24 3.5 L14 11.5" stroke="#eaf1f3" stroke-width="1.6" stroke-linecap="round"/>
    <circle cx="14" cy="3.5" r="2.1" fill="#eaf1f3"/>
    <circle cx="24" cy="3.5" r="2.1" fill="#eaf1f3"/>
    <circle cx="14" cy="11.5" r="2.1" fill="#eaf1f3"/>
    <circle cx="24" cy="11.5" r="2.1" fill="#eaf1f3"/>
    <circle cx="19" cy="7.5" r="1.7" fill="#3aa0ff"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0;0 1;0 0" dur="2s" repeatCount="indefinite"/>
  </g>
  <circle id="light" cx="9" cy="12.6" r="1.8" fill="#f2b134">
    <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.49;0.5;0.99;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M3 19 L5.5 14.5 H14 L16.5 19 Z" fill="#e8282b"/>
  <g id="wave">
    <path d="M-16 19 q4 -2 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 V32 H-16 Z" fill="#0e2c3c"/>
    <path d="M-16 19 q4 -2 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#3aa0ff" stroke-width="1.6"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-16 0" dur="2s" repeatCount="indefinite"/>
  </g>
  <path id="lamp" d="M17 26 L28 22.5 L28 29.5 Z" fill="#f2b134">
    <animate attributeName="opacity" values="0.25;0.7;0.25" dur="2s" repeatCount="indefinite"/>
  </path>
  <rect x="9" y="23.5" width="8" height="5" rx="2" fill="#3aa0ff"/>
  <circle cx="16" cy="26" r="1.3" fill="#eaf1f3"/>
</svg>
